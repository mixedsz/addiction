<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <title>g4_addiction</title>
  <script type="module" crossorigin src="./assets/index-8db74cb8.js"></script>
  <link rel="stylesheet" href="./assets/index-86d33a41.css">
</head>

<body>
  <div id="app"></div>

  <!-- Addiction Creator admin panel (shown via /addictioncreator) -->
  <div id="creator-wrapper"
       style="display:none;position:fixed;inset:0;z-index:9999;background:#111113">
    <iframe id="creator-frame"
            src="./creator.html"
            style="width:100%;height:100%;border:none">
    </iframe>
  </div>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data || !e.data.type) return;
      var wrap  = document.getElementById('creator-wrapper');
      var frame = document.getElementById('creator-frame');

      if (e.data.type === 'openCreator') {
        wrap.style.display = 'block';
        // Forward to iframe so it knows to refresh data
        if (frame && frame.contentWindow)
          frame.contentWindow.postMessage({ type: 'creatorOpen' }, '*');
      }

      if (e.data.type === 'closeCreator') {
        wrap.style.display = 'none';
      }

      // iframe requests close (Escape key or Close Panel button)
      if (e.data.type === 'creatorRequestClose') {
        wrap.style.display = 'none';
        // Notify client to release NUI focus
        fetch('https://g4_addiction/creatorClosed', {
          method: 'POST',
          body: JSON.stringify({})
        }).catch(function () {});
      }
    });
  </script>

</body>

</html>
