<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <title>flake_addiction</title>
  <script type="module" crossorigin src="./assets/index-8db74cb8.js"></script>
  <link rel="stylesheet" href="./assets/index-86d33a41.css">
</head>

<body>
  <div id="app"></div>

  <!-- Addiction Creator admin panel (shown via /addictioncreator) -->
  <!-- Outer wrapper = translucent overlay so the game world shows around the panel -->
  <div id="creator-wrapper"
       style="display:none;position:fixed;inset:0;z-index:9999;
              align-items:center;justify-content:center;
              background:rgba(0,0,0,0.55)">
    <!-- Inner shell gives the panel its size, rounded corners, and border -->
    <div style="width:82vw;height:86vh;border-radius:12px;overflow:hidden;
                border:1px solid rgba(255,255,255,0.07);
                box-shadow:0 24px 64px rgba(0,0,0,0.7)">
      <iframe id="creator-frame"
              src="./creator.html"
              style="width:100%;height:100%;border:none;display:block">
      </iframe>
    </div>
  </div>

  <script>
    window.addEventListener('message', function (e) {
      if (!e.data || !e.data.type) return;
      var wrap  = document.getElementById('creator-wrapper');
      var frame = document.getElementById('creator-frame');

      if (e.data.type === 'openCreator') {
        wrap.style.display = 'flex';   /* flex centres the panel */
        if (frame && frame.contentWindow)
          frame.contentWindow.postMessage({ type: 'creatorOpen' }, '*');
      }

      if (e.data.type === 'closeCreator') {
        wrap.style.display = 'none';
      }

      if (e.data.type === 'creatorRequestClose') {
        wrap.style.display = 'none';
        fetch('https://flake_addiction/creatorClosed', {
          method: 'POST',
          body: JSON.stringify({})
        }).catch(function () {});
      }
    });
  </script>

</body>

</html>
